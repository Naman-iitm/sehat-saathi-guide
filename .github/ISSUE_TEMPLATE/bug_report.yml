name: Bug Report
description: Report a reproducible problem in Sehat Saathi
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly describe the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the exact steps needed to reproduce the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Node.js version, deployment environment, etc."

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Do not include credentials, API keys, or personal health information.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues before opening this issue.
          required: true
        - label: I have removed sensitive information from this report.
          required: true
